[project]
name = "rw-loop-script"
version = "0.1.0"
description = "Ralph-Wiggum-style loop runner that drives the Claude Agent SDK over a spec-kit folder, one fresh-context invocation per user story."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.68",
    "pydantic>=2.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
rw-loop = "rw_loop_script.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rw_loop_script"]

[tool.ruff]
target-version = "py310"
line-length = 100
